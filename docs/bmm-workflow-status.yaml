    note: "Understand existing codebase before planning"

  # Phase 0: Discovery (Optional)
  brainstorm-project:
    status: "skipped"
    agent: "analyst"
    command: "brainstorm-project"
    phase: 0
    note: "Optional discovery workflow - skipped"

  research:
    status: "skipped"
    agent: "analyst"
    command: "research"
    phase: 0
    note: "Optional discovery workflow - skipped"

  product-brief:
    status: "skipped"
    agent: "analyst"
    command: "product-brief"
    phase: 0
    note: "Optional discovery workflow - skipped"

  # Phase 1: Planning
  prd:
    status: "docs/prd.md"
    agent: "pm"
    command: "prd"
    phase: 1
    note: "PRD already exists"

  validate-prd:
